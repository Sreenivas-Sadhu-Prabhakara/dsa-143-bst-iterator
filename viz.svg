<svg xmlns="http://www.w3.org/2000/svg" width="760" height="553" viewBox="0 0 760 553" role="img" aria-label="Step-by-step visual walkthrough">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="context-stroke"/></marker></defs>
<rect x="1.0" y="1.0" width="758.0" height="551.0" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="24.0" y="34.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#1e293b" text-anchor="start" font-weight="600">BST Iterator — a stack holding the left spine</text>
<circle cx="35.0" cy="74.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="78.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
<text x="56.0" y="79.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">next() must yield 1,2,3,4,5,6 lazily in O(h) memory. Keep a stack of the LEFT SPINE:</text>
<text x="56.0" y="98.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">push 5, 3, 2, 1.</text>
<rect x="84.0" y="114.0" width="130.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="149.0" y="133.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">1</text>
<rect x="84.0" y="145.0" width="130.0" height="28.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="149.0" y="164.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">2</text>
<rect x="84.0" y="176.0" width="130.0" height="28.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="149.0" y="195.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">3</text>
<rect x="84.0" y="207.0" width="130.0" height="28.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="149.0" y="226.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">5</text>
<text x="226.0" y="133.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">← top</text>
<text x="72.0" y="181.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">spine (bottom→top)</text>
<line x1="24.0" y1="252.0" x2="736.0" y2="252.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="272.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="276.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
<text x="56.0" y="277.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">next(): pop 1 (smallest). Before returning, push the popped node's RIGHT child's</text>
<text x="56.0" y="296.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">left spine — 1 has none, so the stack is ready: top is 2.</text>
<rect x="84.0" y="312.0" width="130.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="149.0" y="331.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">2</text>
<rect x="84.0" y="343.0" width="130.0" height="28.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="149.0" y="362.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">3</text>
<rect x="84.0" y="374.0" width="130.0" height="28.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="149.0" y="393.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">5</text>
<text x="226.0" y="331.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">← top</text>
<text x="72.0" y="363.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">after next() → 1</text>
<line x1="24.0" y1="419.0" x2="736.0" y2="419.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="439.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="443.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
<text x="56.0" y="444.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Each edge is pushed and popped exactly once across the whole iteration: next() is</text>
<text x="56.0" y="463.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">AMORTIZED O(1), worst-case O(h). hasNext() is just 'stack non-empty'.</text>
<text x="72.0" y="498.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">contract</text>
<rect x="84.0" y="479.0" width="243.0" height="28.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="205.5" y="498.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">yield order → 1 2 3 4 5 6</text>
<rect x="337.0" y="479.0" width="135.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="404.5" y="498.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">memory → O(h)</text>
<text x="380.0" y="535.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">github.com/Sreenivas-Sadhu-Prabhakara · dsa series</text>
</svg>